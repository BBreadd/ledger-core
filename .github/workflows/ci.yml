name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]

    # The same PostgreSQL major the project targets, migrated by the same migration
    # files. This job is the arbiter of whether the code works, not any one laptop.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger -d ledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://ledger:ledger@localhost:5432/ledger

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Apply migrations
        run: npm run migrate

      - name: Migrations are idempotent
        run: npm run migrate

      - name: Test
        run: npm test

      # Audits the ledger the suite just built, including every write it made through the
      # real code path and every one it forced in raw. The tests prove the job notices
      # corruption; this proves there is none to notice. Exits 2 if the books do not
      # reconcile, which fails the job.
      - name: Reconcile
        run: npm run reconcile
